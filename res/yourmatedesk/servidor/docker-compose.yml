# Servidor do YourMateDesk (VPS Ubuntu)
# Copie esta pasta para a VPS e rode:  docker compose up -d
# A chave pública fica em ./data/id_ed25519.pub (é o valor do secret YMD_KEY).
services:
  hbbs:
    container_name: ymd-hbbs
    image: rustdesk/rustdesk-server:latest
    command: hbbs
    volumes:
      - ./data:/root
    network_mode: host
    depends_on:
      - hbbr
    restart: unless-stopped

  hbbr:
    container_name: ymd-hbbr
    image: rustdesk/rustdesk-server:latest
    command: hbbr
    volumes:
      - ./data:/root
    network_mode: host
    restart: unless-stopped
